name: Build APK

# Build ini tidak butuh secrets apa pun.
# Supabase URL + anon key sudah hardcoded di app/build.gradle.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Chiroot debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 4. Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: 5. Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 6. Info APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          echo "### ✅ Chiroot APK siap" >> $GITHUB_STEP_SUMMARY
          echo "Download di tab **Artifacts** → \`chiroot-debug-apk\`" >> $GITHUB_STEP_SUMMARY

      - name: 7. Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiroot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
