name: Build Chiroot APK

on:
  push:
    branches: [main, 'arena/a6493ba0-chiroot-android']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chiroot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and icon-checked APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_REDIRECT_URI: ${{ secrets.SUPABASE_REDIRECT_URI }}
      CHIROOT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Configure Android SDK explicitly
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl --fail --location --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              --output /tmp/chiroot-commandline-tools.zip
            unzip -q /tmp/chiroot-commandline-tools.zip -d /tmp/chiroot-commandline-tools
            mv /tmp/chiroot-commandline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /tmp/chiroot-sdk-licenses.log 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check supplied assets and native-only source
        run: python3 tools/verify_project.py

      - name: Run JVM tests and Android lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-check.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-apk.log

      - name: Verify APK package and embedded launcher icons
        run: python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: chiroot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chiroot-build-reports
          path: |
            gradle-check.log
            gradle-apk.log
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build summary
        if: success()
        run: |
          {
            echo '## Chiroot debug APK'
            echo ''
            echo '- Artifact: **chiroot-debug-apk**'
            echo '- File: `app-debug.apk`'
            echo '- Commit: `${{ github.sha }}`'
            echo '- Launcher icon: supplied `favicon.png`; adaptive and legacy resources verified inside the APK.'
            echo '- JVM tests, Android lint and APK package checks passed.'
            echo '- Device playback/OAuth tests are still required; this is a debug build, not a signed store release.'
          } >> "$GITHUB_STEP_SUMMARY"
