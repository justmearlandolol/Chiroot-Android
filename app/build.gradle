plugins {
    id 'com.android.application'
}
def CHIROOT_SUPABASE_URL = "https://astuagdezahmuuwjoghf.supabase.co"
def CHIROOT_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzdHVhZ2RlemFobXV1d2pvZ2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2Njc5NTgsImV4cCI6MjA5OTI0Mzk1OH0.cyslC214rmCtdDuif1egE7fqCCaOGjFJKaUf6T_2Hl0"
def CHIROOT_REDIRECT_URI = "id.my.chiroot://auth-callback"

android {
    namespace 'id.my.chiroot'
    compileSdk 35

    defaultConfig {
        applicationId "id.my.chiroot"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "SUPABASE_URL", "\"${CHIROOT_SUPABASE_URL}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${CHIROOT_SUPABASE_ANON_KEY}\""
        buildConfigField "String", "OAUTH_REDIRECT_URI", "\"${CHIROOT_REDIRECT_URI}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Release signing is OPTIONAL. If a keystore is supplied through the
    // standard env vars (CI or your machine), the release APK is signed;
    // otherwise Gradle produces app-release-unsigned.apk as usual.
    signingConfigs {
        release {
            def storePath = System.getenv("CHIROOT_KEYSTORE_FILE") ?: project.findProperty("CHIROOT_KEYSTORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("CHIROOT_KEYSTORE_PASSWORD") ?: project.findProperty("CHIROOT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CHIROOT_KEY_ALIAS") ?: project.findProperty("CHIROOT_KEY_ALIAS")
                keyPassword System.getenv("CHIROOT_KEY_PASSWORD") ?: project.findProperty("CHIROOT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Debug gets its own app id so it can live next to a release install.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("CHIROOT_KEYSTORE_FILE") || project.hasProperty("CHIROOT_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'com.google.android.material:material:1.12.0'
}
